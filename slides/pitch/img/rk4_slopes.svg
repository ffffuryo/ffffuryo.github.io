<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 640 300">
  <rect x="0" y="0" width="640" height="300" fill="#FFFFFF"/>
  <line x1="320" y1="20" x2="320" y2="280" stroke="#8A93A1" stroke-width="1"/>

  <!-- left panel: true RK4 -->
  <text x="160" y="36" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="18" font-weight="bold" fill="#1A2029">本来の RK4</text>
  <path d="M40,240 C140,235 200,170 280,80" fill="none" stroke="#1A2029" stroke-width="2.5"/>
  <line x1="20" y1="241" x2="60" y2="239" stroke="#0E6E76" stroke-width="3"/>
  <line x1="127.6" y1="217.9" x2="161.7" y2="197.9" stroke="#0E6E76" stroke-width="3"/>
  <line x1="174.7" y1="186.9" x2="204.8" y2="160.6" stroke="#0E6E76" stroke-width="3"/>
  <line x1="266.7" y1="95" x2="293.3" y2="65" stroke="#0E6E76" stroke-width="3"/>
  <circle cx="40" cy="240" r="3.5" fill="#1A2029"/>
  <circle cx="144.6" cy="207.4" r="3.5" fill="#1A2029"/>
  <circle cx="189.8" cy="173.8" r="3.5" fill="#1A2029"/>
  <circle cx="280" cy="80" r="3.5" fill="#1A2029"/>
  <text x="26" y="226" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">k1</text>
  <text x="152" y="238" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">k2</text>
  <text x="206" y="200" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">k3</text>
  <text x="262" y="64" text-anchor="end" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">k4</text>
  <text x="160" y="282" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="15" fill="#4B5563">各点で傾きを測り直す</text>

  <!-- right panel: code implementation (drawn at local origin, shifted by 320) -->
  <g transform="translate(320,0)">
    <text x="160" y="36" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="18" font-weight="bold" fill="#1A2029">コードの実装</text>
    <circle cx="40" cy="240" r="3.5" fill="#1A2029"/>
    <line x1="20" y1="241" x2="60" y2="239" stroke="#B5541F" stroke-width="3"/>
    <line x1="20" y1="241" x2="60" y2="239" stroke="#B5541F" stroke-width="3"/>
    <line x1="20" y1="241" x2="60" y2="239" stroke="#B5541F" stroke-width="3"/>
    <line x1="20" y1="241" x2="60" y2="239" stroke="#B5541F" stroke-width="3"/>
    <text x="72" y="214" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#B5541F">k1</text>
    <text x="72" y="230" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#B5541F">k2</text>
    <text x="72" y="246" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#B5541F">k3</text>
    <text x="72" y="262" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#B5541F">k4</text>
    <text x="160" y="282" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="15" fill="#1A2029">同じ傾き α₀ を使い回している</text>
  </g>
