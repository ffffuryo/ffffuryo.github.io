<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 600 340">
  <defs>
    <marker id="ah-soft" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8A93A1"/>
    </marker>
    <marker id="ah-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1A2029"/>
    </marker>
    <marker id="ah-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#B5541F"/>
    </marker>
    <marker id="ah-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0E6E76"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="340" fill="#FFFFFF"/>

  <!-- velocity -->
  <line x1="230" y1="60" x2="388" y2="60" stroke="#8A93A1" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah-soft)"/>
  <text x="400" y="66" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#4B5563">進行方向 v</text>

  <!-- ball -->
  <circle cx="300" cy="170" r="40" fill="#F5F7F9" stroke="#1A2029" stroke-width="2"/>

  <!-- backspin: counterclockwise on screen, top surface moves backward -->
  <path d="M350.2,183.5 A52,52 0 0 0 322,122.9" fill="none" stroke="#1A2029" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="362" y="150" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#1A2029">バックスピン</text>

  <!-- forces (60 px per newton) -->
  <line x1="300" y1="170" x2="300" y2="255.2" stroke="#1A2029" stroke-width="3" marker-end="url(#ah-ink)"/>
  <text x="312" y="250" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#1A2029">重力 mg ≈ 1.42 N</text>

  <line x1="300" y1="170" x2="197.4" y2="170" stroke="#B5541F" stroke-width="3" marker-end="url(#ah-orange)"/>
  <text x="188" y="158" text-anchor="end" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#B5541F">空気抵抗 Fd ≈ 1.71 N</text>

  <line x1="300" y1="170" x2="300" y2="114.8" stroke="#0E6E76" stroke-width="3" marker-end="url(#ah-teal)"/>
  <text x="288" y="120" text-anchor="end" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">マグヌス力 Fi ≈ 0.92 N</text>
</svg>
