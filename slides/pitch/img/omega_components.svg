<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 640 220">
  <defs>
    <marker id="ah-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0E6E76"/>
    </marker>
    <marker id="ah-soft" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8A93A1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="220" fill="#FFFFFF"/>

  <!-- left: omega perpendicular to v -->
  <circle cx="160" cy="100" r="34" fill="#F5F7F9" stroke="#1A2029" stroke-width="1.8"/>
  <line x1="160" y1="100" x2="160" y2="50" stroke="#0E6E76" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <text x="172" y="56" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">ω</text>
  <line x1="202" y1="100" x2="256" y2="100" stroke="#8A93A1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-soft)"/>
  <text x="264" y="106" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#4B5563">v</text>
  <text x="160" y="172" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#1A2029">ω ⊥ v（バックスピン型）</text>
  <text x="160" y="198" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">sinθ = 1 → マグヌス力 最大</text>

  <!-- right: omega parallel to v -->
  <circle cx="480" cy="100" r="34" fill="#F5F7F9" stroke="#1A2029" stroke-width="1.8"/>
  <ellipse cx="480" cy="100" rx="34" ry="12" fill="none" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="480" y1="100" x2="540" y2="100" stroke="#0E6E76" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <text x="550" y="106" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#0E6E76">ω</text>
  <line x1="440" y1="46" x2="544" y2="46" stroke="#8A93A1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-soft)"/>
  <text x="552" y="52" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#4B5563">v</text>
  <text x="480" y="172" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#1A2029">ω ∥ v（ジャイロ型）</text>
  <text x="480" y="198" text-anchor="middle" font-family="IPAPGothic, Noto Sans JP, sans-serif" font-size="16" fill="#4B5563">sinθ = 0 → マグヌス力 ゼロ</text>
</svg>
